<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Signup | Agricultural Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="topbar py-2">
        <div class="container d-flex justify-content-between"><span>Agricultural Hub</span><span
                id="liveDateTime"></span></div>
    </div>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container"><a class="navbar-brand brand" href="index.html">Agricultural Hub</a><button
                class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="product-detail.html">Product-detail</a></li>
                    <li class="nav-item"><a class="nav-link" href="signup.html">Signup</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="breadcrumb-area py-3">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active">Signup</li>
                </ol>
            </nav>
        </div>
    </section>
    <section class="container py-5">
        <div class="card form-card p-4">
            <h2 class="section-title mb-4">Register</h2>
            <form onsubmit="signupAlert(event)">
                <div class="mb-3"><label class="form-label">Full Name</label><input type="text" class="form-control"
                        required></div>
                <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control"
                        required></div>
                <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control"
                        required></div><button class="btn btn-green" type="submit">Register</button>
            </form>
        </div>
    </section>
    <footer class="footer mt-5 py-4">
        <div class="container text-center">
            <h5>Agricultural Hub</h5>
            <p class="mb-0">Agricultural products and farming essentials.</p>
        </div>
    </footer>
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
